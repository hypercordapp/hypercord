name: Build DevBuild
on:
    push:
        branches:
            - main
        paths:
            - .github/workflows/build.yml
            - src/**
            - browser/**
            - scripts/build/**
            - package.json
            - pnpm-lock.yaml
    workflow_dispatch:
env:
    FORCE_COLOR: true

jobs:
    Build:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6 # Install pnpm using packageManager key in package.json

            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build web
              run: pnpm buildWebStandalone

            - name: Build
              run: pnpm build --standalone

            - name: Generate plugin list
              run: pnpm generatePluginJson dist/plugins.json dist/plugin-readmes.json

            - name: Clean up obsolete files
              run: |
                  rm -rf dist/*-unpacked dist/vendor HyperCord.user.css vencordDesktopRenderer.css vencordDesktopRenderer.css.map

            # Lets the desktop app's own self-updater (src/main/updater/http.ts)
            # verify the integrity of patcher.js/preload.js/renderer.js/renderer.css
            # before overwriting its own files with them - same fix already applied
            # to the sibling HyperCordInstaller repo's self-updater.
            - name: Generate checksums
              run: |
                  cd dist
                  sha256sum * > checksums.txt
                  cd ..

            - name: Get some values needed for the release
              id: release_values
              run: |
                  echo "release_tag=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

            - name: Upload DevBuild as release
              if: github.repository == 'hypercordapp/hypercord'
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: devbuild
                  name: DevBuild ${{ env.release_tag }}
                  prerelease: false
                  draft: false
                  files: dist/*
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Send Discord Announcement
              if: github.repository == 'hypercordapp/hypercord'
              env:
                  DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
                  DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_DEVBUILD_CHANNEL_ID }}
              run: |
                  node -e "
                  const { execSync } = require('child_process');
                  const token = process.env.DISCORD_BOT_TOKEN;
                  const channelId = process.env.DISCORD_CHANNEL_ID || '1529223931851182181';
                  if (!token) {
                      console.log('DISCORD_BOT_TOKEN secret not present, skipping Discord announcement');
                      process.exit(0);
                  }
                  const tag = process.env.release_tag || '${{ env.release_tag }}';
                  
                  let bullets = [];
                  try {
                      const rawCommitMsg = execSync('git log -1 --pretty=%B', { encoding: 'utf-8' }).trim();
                      const lines = rawCommitMsg.split('\n').map(l => l.trim()).filter(Boolean);
                      const subject = lines[0] || 'Yeni güncellemeler ve hata düzeltmeleri';
                      const bodyLines = lines.slice(1);
                      if (bodyLines.length > 0) {
                          for (const line of bodyLines) {
                              if (line.startsWith('•') || line.startsWith('-') || line.startsWith('*')) {
                                  bullets.push('• ' + line.replace(/^[•\-\*]\s*/, ''));
                              } else if (line.length > 0) {
                                  bullets.push('• ' + line);
                              }
                          }
                      }
                      if (bullets.length === 0) {
                          let clean = subject.replace(/^[a-z]+(\([^\)]+\))?:\s*/i, '');
                          if (/context menu|crash|infinite|divider/i.test(clean)) {
                              clean = 'Sağ tık menüsündeki çökme hatası ve alt menü açılmama sorunları tamamen giderildi.';
                          } else if (/discord|announcement|role/i.test(clean)) {
                              clean = 'Otomatik Discord devbuild güncelleme duyuruları ve bildirim rolü entegre edildi.';
                          }
                          bullets.push('• ' + clean);
                      }
                  } catch (e) {
                      bullets.push('• Performans, stabilite ve hata düzeltmeleri');
                  }

                  const roleId = '1540838002077605921';
                  const content = '<@&' + roleId + '> 🚀 New devbuild published: \`DevBuild ' + tag + '\`\n\n' +
                      '**Yenilikler / Düzeltmeler:**\n' +
                      bullets.join('\n') + '\n\n' +
                      'Changelog: <https://hypercord.pro/changelog>\n' +
                      'Download: <https://github.com/hypercordapp/hypercord/releases/tag/devbuild>';

                  fetch('https://discord.com/api/v10/channels/' + channelId + '/messages', {
                      method: 'POST',
                      headers: {
                          'Authorization': 'Bot ' + token,
                          'Content-Type': 'application/json'
                      },
                      body: JSON.stringify({
                          content,
                          allowed_mentions: { roles: [roleId] }
                      })
                  }).then(r => {
                      console.log('Discord announcement status:', r.status);
                  }).catch(console.error);
                  "
